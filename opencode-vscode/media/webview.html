<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="{{CSP}}" />
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; flex-direction: column;
    font-family: var(--vscode-font-family);
    font-size: var(--vscode-font-size);
    color: var(--vscode-foreground);
    background: transparent;
  }

  /* ---------------------------------------------------------- palco/conversa */
  #stage { flex: 1; position: relative; overflow: hidden; }
  #log {
    position: absolute; inset: 0; overflow-y: auto;
    padding: 14px 14px 4px; overscroll-behavior: contain;
  }
  #msgs { max-width: 860px; margin: 0 auto; width: 100%; }

  /* tela de boas-vindas (Codex-like) */
  #welcome {
    position: absolute; inset: 0; z-index: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; text-align: center; padding: 0 18px; pointer-events: none;
  }
  #welcome[hidden] { display: none; }
  #welcome svg { width: 34px; height: 34px; stroke: var(--vscode-textLink-foreground); }
  #welcome h1 { font-size: 1.15em; font-weight: 600; margin: 0; }
  #welcome p { margin: 0; opacity: .6; font-size: .92em; max-width: 320px; line-height: 1.45; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 8px; pointer-events: auto; }
  .chip {
    border: 1px solid var(--vscode-widget-border, rgba(128,128,128,.35));
    background: var(--vscode-editorWidget-background);
    color: var(--vscode-foreground); border-radius: 999px;
    padding: 5px 11px; font-size: .85em; cursor: pointer; font-family: inherit;
  }
  .chip:hover { background: var(--vscode-list-hoverBackground); border-color: var(--vscode-focusBorder); }
  .kbd { opacity: .5; font-size: .8em; margin-top: 10px; }
  kbd {
    border: 1px solid var(--vscode-widget-border, rgba(128,128,128,.4));
    border-bottom-width: 2px; border-radius: 4px; padding: 0 5px;
    font-family: var(--vscode-editor-font-family, monospace); font-size: .9em;
  }

  /* mensagens */
  .msg { margin: 0 0 14px; animation: fadein .18s ease-out; word-break: break-word; }
  .msg .role {
    font-size: .72em; text-transform: uppercase; letter-spacing: .07em;
    opacity: .5; margin-bottom: 4px;
  }
  .msg.user {
    background: var(--vscode-editorWidget-background);
    border: 1px solid var(--vscode-widget-border, rgba(128,128,128,.25));
    border-radius: 12px 12px 4px 12px;
    padding: 8px 11px; margin-left: 12%;
    white-space: pre-wrap; line-height: 1.45;
  }
  .msg.assistant .role { color: var(--vscode-textLink-foreground); opacity: .85; }
  .msg.assistant .content { line-height: 1.5; }

  /* markdown */
  .msg p { margin: 0 0 8px; }
  .msg p:last-child { margin-bottom: 0; }
  .msg h1, .msg h2, .msg h3, .msg h4 { font-size: 1.02em; margin: 12px 0 6px; }
  .msg ul, .msg ol { margin: 4px 0 8px; padding-left: 20px; }
  .msg li { margin: 2px 0; }
  .msg blockquote {
    margin: 6px 0; padding: 2px 10px; opacity: .8;
    border-left: 3px solid var(--vscode-textBlockQuote-border, var(--vscode-textLink-foreground));
  }
  .msg code {
    font-family: var(--vscode-editor-font-family, monospace); font-size: .92em;
    background: var(--vscode-textCodeBlock-background, rgba(128,128,128,.18));
    padding: 1px 5px; border-radius: 4px;
  }
  .msg pre.code {
    background: var(--vscode-textCodeBlock-background, rgba(128,128,128,.15));
    border: 1px solid var(--vscode-widget-border, rgba(128,128,128,.25));
    border-radius: 8px; padding: 9px 11px; overflow-x: auto; margin: 8px 0;
  }
  .msg pre.code code { background: none; padding: 0; font-size: .88em; line-height: 1.45; }
  .msg a { color: var(--vscode-textLink-foreground); }

  /* raciocínio colapsável */
  details.reasoning {
    border-left: 2px solid var(--vscode-descriptionForeground, rgba(128,128,128,.5));
    padding: 2px 0 2px 9px; margin: 0 0 10px; opacity: .75; font-size: .92em;
  }
  details.reasoning summary { cursor: pointer; font-style: italic; user-select: none; }
  details.reasoning .rtext { white-space: pre-wrap; margin-top: 5px; font-style: italic; }

  .meta {
    display: table; font-size: .75em; opacity: .5;
    margin: -8px auto 12px;
  }
  .error {
    background: var(--vscode-inputValidation-errorBackground);
    border: 1px solid var(--vscode-inputValidation-errorBorder, rgba(220,80,80,.6));
    color: var(--vscode-errorForeground); border-radius: 8px;
    padding: 7px 10px; font-size: .9em; white-space: pre-wrap;
  }

  /* indicador "pensando" */
  #thinking {
    display: none; align-items: center; gap: 5px;
    max-width: 860px; margin: 0 auto; padding: 2px 0 14px;
    color: var(--vscode-textLink-foreground);
  }
  #thinking.on { display: flex; }
  #thinking i {
    width: 7px; height: 7px; border-radius: 50%; background: currentColor;
    opacity: .3; animation: blink 1.1s infinite;
  }
  #thinking i:nth-child(2) { animation-delay: .18s; }
  #thinking i:nth-child(3) { animation-delay: .36s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; transform: scale(.85); } 40% { opacity: 1; transform: scale(1); } }
  @keyframes fadein { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }

  /* ---------------------------------------------------------- composer */
  #composer {
    margin: 6px 10px 10px; max-width: 860px; width: calc(100% - 20px);
    align-self: center;
    border: 1px solid var(--vscode-input-border, rgba(128,128,128,.35));
    background: var(--vscode-input-background);
    border-radius: 12px; padding: 7px 8px 6px;
    transition: border-color .15s;
  }
  #composer:focus-within { border-color: var(--vscode-focusBorder); }
  /* badge de contexto anexado (#5) */
  .ctx-badge {
    display: block; font-size: .72em; opacity: .7; padding: 0 4px 4px;
    color: var(--vscode-descriptionForeground);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ctx-badge[hidden] { display: none; }
  #input {
    width: 100%; border: none; outline: none; resize: none; padding: 2px 4px;
    background: transparent; color: var(--vscode-input-foreground);
    font-family: inherit; font-size: inherit; line-height: 1.45;
    max-height: 170px; overflow-y: auto; display: block;
  }
  #input::placeholder { color: var(--vscode-input-placeholderForeground, var(--vscode-descriptionForeground)); }
  .toolbar { display: flex; align-items: center; gap: 4px; margin-top: 5px; }
  .icon {
    display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border-radius: 6px; border: none; cursor: pointer;
    background: transparent; color: var(--vscode-foreground); opacity: .75;
    font-size: 14px; line-height: 1; padding: 0; font-family: inherit;
  }
  .icon:hover { background: var(--vscode-toolbar-hoverBackground, rgba(128,128,128,.2)); opacity: 1; }
  .hint { font-size: .75em; opacity: .45; margin-left: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: .75em; opacity: .7; margin-left: auto; white-space: nowrap;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--vscode-charts-yellow, #e0a100); }
  .dot.on { background: var(--vscode-charts-green, #3fb950); }
  .dot.off { background: var(--vscode-errorForeground); }
  #send {
    width: 27px; height: 27px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--vscode-button-background); color: var(--vscode-button-foreground);
    font-size: 15px; display: inline-flex; align-items: center; justify-content: center;
    font-family: inherit; margin-left: 4px;
  }
  #send:hover { background: var(--vscode-button-hoverBackground); }
  #send:disabled { opacity: .35; cursor: default; }

  @media (max-width: 340px) { .hint { display: none; } }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(128,128,128,.35); border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
  <div id="stage">
    <div id="log">
      <div id="msgs"></div>
      <div id="thinking"><i></i><i></i><i></i></div>
    </div>

    <div id="welcome">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2.5" y="3.5" width="19" height="15" rx="2.5" />
        <path d="M6 8.5h6M6 12h9" />
        <path d="M7.5 21l3-2.5h9" />
      </svg>
      <h1>OpenCode</h1>
      <p>Pergunte, peça mudanças e acompanhe o agente trabalhando no seu código.</p>
      <div class="chips">
        <button class="chip">Explique o arquivo aberto</button>
        <button class="chip">Corrija os erros do projeto</button>
        <button class="chip">Sugira melhorias neste trecho</button>
      </div>
      <div class="kbd"><kbd>Enter</kbd> envia · <kbd>Shift</kbd>+<kbd>Enter</kbd> quebra linha</div>
    </div>
  </div>

  <div id="composer">
    <div id="ctxBadge" class="ctx-badge" hidden></div>
    <textarea id="input" rows="1" placeholder="Pergunte ao OpenCode…"></textarea>
    <div class="toolbar">
      <button class="icon" id="ref" title="Inserir referência @arquivo (Ctrl+Alt+K)">@</button>
      <button class="icon" id="new" title="Nova sessão">＋</button>
      <span class="hint">Enter envia · Shift+Enter quebra linha</span>
      <span class="status" id="status" title=""><span class="dot" id="dot"></span><span id="statusText">conectando…</span></span>
      <button id="send" title="Enviar (Enter)" disabled>↑</button>
    </div>
  </div>

  <script nonce="{{NONCE}}">
    const vscode = acquireVsCodeApi();
    const log = document.getElementById('log');
    const msgs = document.getElementById('msgs');
    const welcome = document.getElementById('welcome');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const thinking = document.getElementById('thinking');
    const dot = document.getElementById('dot');
    const statusText = document.getElementById('statusText');
    const statusEl = document.getElementById('status');

    let current = null;        // .content do assistente em andamento
    let currentText = '';
    let reasoningEl = null;
    let renderTimer = 0;
    let pinned = true;         // rolagem automática só quando o usuário está no fim
    let online = null;
    let sessionId = null;

    // --------------------------------------------------------- markdown
    const esc = (s) => s.replace(/[&<>"']/g, (c) => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));

    function md(src) {
      const codes = [];
      const t = esc(src).replace(/```[^\n]*\n?([\s\S]*?)(?:```|$)/g, (m, code) => {
        codes.push('<pre class="code"><code>' + code.replace(/\n$/, '') + '</code></pre>');
        return '\u0000' + (codes.length - 1) + '\u0000';
      });
      const inline = (s) => s
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>')
        .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');

      let out = '';
      let list = null;
      const closeList = () => { if (list) { out += '</' + list + '>'; list = null; } };

      for (const raw of t.split('\n')) {
        const line = raw.trimEnd();
        const bare = line.trim();
        if (/^\u0000\d+\u0000$/.test(bare)) { closeList(); out += bare; continue; }
        const h = line.match(/^(#{1,4})\s+(.*)$/);
        if (h) { closeList(); out += '<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>'; continue; }
        const li = line.match(/^\s*[-*]\s+(.*)$/);
        if (li) {
          if (list !== 'ul') { closeList(); out += '<ul>'; list = 'ul'; }
          out += '<li>' + inline(li[1]) + '</li>'; continue;
        }
        const oli = line.match(/^\s*\d+\.\s+(.*)$/);
        if (oli) {
          if (list !== 'ol') { closeList(); out += '<ol>'; list = 'ol'; }
          out += '<li>' + inline(oli[1]) + '</li>'; continue;
        }
        const quote = line.match(/^&gt;\s?(.*)$/);
        if (quote) { closeList(); out += '<blockquote>' + inline(quote[1]) + '</blockquote>'; continue; }
        if (bare === '') { closeList(); continue; }
        closeList();
        out += '<p>' + inline(line) + '</p>';
      }
      closeList();
      return out.replace(/\u0000(\d+)\u0000/g, (m, i) => codes[+i]);
    }

    // ------------------------------------------------------------ utils
    const scroll = () => { log.scrollTop = log.scrollHeight; };
    const nearBottom = () => log.scrollHeight - log.scrollTop - log.clientHeight < 90;
    log.addEventListener('scroll', () => { pinned = nearBottom(); });
    const autoScroll = () => { if (pinned) scroll(); };

    function renderCurrent() {
      renderTimer = 0;
      if (!current) return;
      current.innerHTML = md(currentText);
      autoScroll();
    }
    function scheduleRender() {
      if (renderTimer) return;
      renderTimer = setTimeout(renderCurrent, 60);
    }

    function addUser(text) {
      welcome.hidden = true;
      const el = document.createElement('div');
      el.className = 'msg user';
      el.textContent = text;
      msgs.appendChild(el);
      pinned = true; scroll();
    }
    function startAssistant() {
      const el = document.createElement('div');
      el.className = 'msg assistant';
      el.innerHTML = '<div class="role">OpenCode</div><div class="content"></div>';
      msgs.appendChild(el);
      pinned = true;
      return el.querySelector('.content');
    }
    function addError(text) {
      const el = document.createElement('div');
      el.className = 'msg error';
      el.textContent = text;
      msgs.appendChild(el);
      pinned = true; scroll();
    }
    function clearConversation() {
      msgs.innerHTML = '';
      current = null; currentText = ''; reasoningEl = null;
      if (renderTimer) { clearTimeout(renderTimer); renderTimer = 0; }
      welcome.hidden = false;
      thinking.classList.remove('on');
      pinned = true; log.scrollTop = 0;
    }
    function updateStatus() {
      dot.className = 'dot' + (online === true ? ' on' : online === false ? ' off' : '');
      statusText.textContent = online === true ? 'online' : online === false ? 'offline' : 'conectando…';
      statusEl.title = sessionId ? 'sessão ' + sessionId : 'servidor OpenCode';
    }

    // ----------------------------------------------------------- composer
    const resize = () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 170) + 'px';
      sendBtn.disabled = input.value.trim().length === 0;
    };

    const send = () => {
      const text = input.value.trim();
      if (!text) return;
      addUser(text);
      input.value = '';
      resize();
      vscode.postMessage({ type: 'send', text });
      input.focus();
    };

    sendBtn.addEventListener('click', send);
    input.addEventListener('input', resize);
    input.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' || e.isComposing) return;
      if (e.shiftKey) return;          // Shift+Enter: quebra de linha (comporta como Enter)
      e.preventDefault();               // Enter (ou Ctrl+Enter): envia
      send();
    });

    document.getElementById('new').addEventListener('click', () => {
      clearConversation();
      vscode.postMessage({ type: 'newSession' });
      input.focus();
    });
    document.getElementById('ref').addEventListener('click', () =>
      vscode.postMessage({ type: 'insertReference' })
    );
    document.querySelectorAll('.chip').forEach((chip) =>
      chip.addEventListener('click', () => {
        input.value = chip.textContent.trim();
        resize();
        input.focus();
      })
    );

    // --------------------------------------------------------- host -> UI
    window.addEventListener('message', (e) => {
      const m = e.data;
      switch (m.type) {
        case 'server':
          online = !!m.baseUrl;
          if (m.sessionId) sessionId = String(m.sessionId);
          updateStatus();
          break;
        case 'session:id':
          sessionId = String(m.sessionId);
          updateStatus();
          break;
        case 'context:attached': {
          // #5: mostra ao usuário o que será anexado ao prompt (nada em silêncio).
          const ctx = document.getElementById('ctxBadge');
          if (ctx) {
            if (m.label) {
              ctx.textContent = 'anexando ' + String(m.label);
              ctx.hidden = false;
            } else {
              ctx.hidden = true;
              ctx.textContent = '';
            }
          }
          break;
        }
        case 'text:delta':
          if (!current) { current = startAssistant(); currentText = ''; }
          currentText += m.text ?? '';
          scheduleRender();
          break;
        case 'text:ended':
          if (!current) { current = startAssistant(); currentText = ''; }
          if (m.text) currentText = m.text;
          if (renderTimer) { clearTimeout(renderTimer); renderTimer = 0; }
          renderCurrent();
          current = null; currentText = '';
          break;
        case 'reasoning:delta': {
          if (!reasoningEl) {
            const d = document.createElement('details');
            d.className = 'reasoning';
            d.open = true;
            d.innerHTML = '<summary>raciocínio</summary><div class="rtext"></div>';
            msgs.appendChild(d);
            reasoningEl = d.querySelector('.rtext');
          }
          reasoningEl.textContent += m.text ?? '';
          autoScroll();
          break;
        }
        case 'step:ended': {
          const t = m.tokens || {};
          const parts = [];
          if (t.input != null || t.output != null) parts.push('tokens ' + (t.input ?? '—') + '/' + (t.output ?? '—'));
          if (typeof m.cost === 'number') parts.push('$' + m.cost.toFixed(4));
          if (m.finish) parts.push(String(m.finish));
          if (parts.length) {
            const el = document.createElement('div');
            el.className = 'meta';
            el.textContent = parts.join(' · ');
            msgs.appendChild(el);
            autoScroll();
          }
          if (reasoningEl) {
            const d = reasoningEl.closest('details');
            if (d) d.open = false;
            reasoningEl = null;
          }
          break;
        }
        case 'exec:start':
          thinking.classList.add('on');
          autoScroll();
          break;
        case 'exec:end':
          thinking.classList.remove('on');
          break;
        case 'error':
          thinking.classList.remove('on');
          addError('erro: ' + m.text);
          break;
        case 'session:new':
          clearConversation();
          break;
        case 'focus':
          input.focus();
          break;
      }
    });

    updateStatus();
    resize();
    vscode.postMessage({ type: 'ready' });
  </script>
</body>
</html>
